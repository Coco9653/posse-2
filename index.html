<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reverie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-900 bg-opacity-90 min-h-screen text-amber-50">

  <!-- ヘッダー -->
  <header class="text-center py-16">
    <h1 class="text-5xl font-bold tracking-widest">The Reverie</h1>
    <p class="mt-4 text-xl tracking-wider">～時間を忘れ、羽をのばす場所～</p>
    <p class="mt-2 text-base tracking-wide">現実世界で追われるあなたに、Reverie――白昼夢を提供します</p>
  </header>

  <!-- メニューカード -->
  <main class="max-w-4xl mx-auto px-6 pb-16">
    <div class="bg-yellow-50 bg-opacity-80 rounded-lg shadow-xl p-10 text-gray-800">

      <h2 class="text-5xl font-bold text-center mb-10">Menu</h2>

      <div class="grid grid-cols-2 gap-10">

        <!-- Drinkセクション -->
        <section>
          <h3 class="text-2xl font-bold mb-6">Drink</h3>
          <ul class="space-y-4">
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">コーヒー</span>
              <span class="text-sm text-gray-500">¥500</span>
            </li>
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">チャイラテ</span>
              <span class="text-sm text-gray-500">¥600</span>
            </li>
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">アイスティー</span>
              <span class="text-sm text-gray-500">¥400</span>
            </li>
          </ul>
        </section>

        <!-- Foodセクション -->
        <section>
          <h3 class="text-2xl font-bold mb-6">Food</h3>
          <ul class="space-y-4">
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">アボカドトースト</span>
              <span class="text-sm text-gray-500">¥700</span>
            </li>
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">ラザニア</span>
              <span class="text-sm text-gray-500">¥800</span>
            </li>
            <li class="flex justify-between">
              <span class="text-base hover:text-teal-600 hover:font-semibold transition-colors duration-200 cursor-pointer">海の幸のペペロンチーノ</span>
              <span class="text-sm text-gray-500">¥900</span>
            </li>
          </ul>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
